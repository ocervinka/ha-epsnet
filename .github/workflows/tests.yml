name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    name: pytest (HA ${{ matrix.label }})
    runs-on: ubuntu-latest
    # The "latest" job is informational: a new Home Assistant release breaking
    # something must not block PRs on unrelated changes — it's an early warning.
    # The pinned job (the reference deployment) is the required gate.
    continue-on-error: ${{ matrix.spec == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2026.2 (pinned, oldest supported)"
            spec: "==0.13.316"
            python: "3.13"
          # Home Assistant 2026.10+ needs Python 3.14; on 3.13 pip silently
          # resolves "latest" to the last 3.13-compatible release.
          - label: "latest"
            spec: ""
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        # Do NOT install the component as a package: `pip install -e .` adds an
        # __editable__ finder that breaks Home Assistant's custom_components scan.
        # The tests import it via pythonpath=["."] (see pyproject) instead.
        run: |
          python -m pip install --upgrade pip
          pip install "pytest-homeassistant-custom-component${{ matrix.spec }}"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Run tests
        run: pytest -q
